# Maki Dice (Windows)
# github.com/andrewmichaelpowell

name: Build Maki Dice (Windows)

on:
  workflow_dispatch:

jobs:
  package:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Build arm64
        run: dotnet publish -c Release -r win-arm64 --self-contained true

      - name: Build x64
        run: dotnet publish -c Release -r win-x64 --self-contained true

      - name: Configure Tools
        id: sdk
        shell: pwsh
        run: |
          $sdkBin = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Directory |
                    Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' } |
                    Sort-Object { [version]$_.Name } -Descending |
                    Select-Object -First 1

          $makepri = Join-Path $sdkBin.FullName "x64\MakePri.exe"
          $makeappx = Join-Path $sdkBin.FullName "x64\MakeAppx.exe"

          "makepri=$makepri"   >> $env:GITHUB_OUTPUT
          "makeappx=$makeappx" >> $env:GITHUB_OUTPUT

      - name: Build MSIX Package
        shell: pwsh
        env:
          MAKEPRI: ${{ steps.sdk.outputs.makepri }}
          MAKEAPPX: ${{ steps.sdk.outputs.makeappx }}
        run: |
          if (Test-Path .\bundle) { Remove-Item -Recurse -Force .\bundle }
          $null = New-Item -ItemType Directory -Force -Path .\bundle\win-arm64\publish\Assets
          $null = New-Item -ItemType Directory -Force -Path .\bundle\win-x64\publish\Assets
          $null = New-Item -ItemType Directory -Force -Path .\bundle\msix

          Copy-Item -Path .\bin\Release\net9.0-windows\win-arm64\publish\* -Destination .\bundle\win-arm64\publish\
          Copy-Item -Path .\Packages\Manifests\win-arm64\AppxManifest.xml -Destination .\bundle\win-arm64\publish\AppxManifest.xml
          Copy-Item -Path .\Packages\Assets\* -Destination .\bundle\win-arm64\publish\Assets\

          Copy-Item -Path .\bin\Release\net9.0-windows\win-x64\publish\* -Destination .\bundle\win-x64\publish\
          Copy-Item -Path .\Packages\Manifests\win-x64\AppxManifest.xml -Destination .\bundle\win-x64\publish\AppxManifest.xml
          Copy-Item -Path .\Packages\Assets\* -Destination .\bundle\win-x64\publish\Assets\

          & $env:MAKEPRI createconfig /cf ".\bundle\priconfig.xml" /dq en-US /o

          & $env:MAKEPRI new /pr ".\bundle\win-arm64\publish" /cf ".\bundle\priconfig.xml" /mn ".\bundle\win-arm64\publish\AppxManifest.xml" /of ".\bundle\win-arm64\publish\resources.pri" /o
          & $env:MAKEAPPX pack /d ".\bundle\win-arm64\publish" /p ".\bundle\msix\makidice-windows-arm64.msix" /o

          & $env:MAKEPRI new /pr ".\bundle\win-x64\publish" /cf ".\bundle\priconfig.xml" /mn ".\bundle\win-x64\publish\AppxManifest.xml" /of ".\bundle\win-x64\publish\resources.pri" /o
          & $env:MAKEAPPX pack /d ".\bundle\win-x64\publish" /p ".\bundle\msix\makidice-windows-x64.msix" /o

          & $env:MAKEAPPX bundle /d ".\bundle\msix" /p ".\bundle\makidice-windows.msixbundle" /o

      - name: Upload MSIX Artifact
        uses: actions/upload-artifact@v6
        with:
          name: makidice-windows-msixbundle
          path: .\bundle\makidice-windows.msixbundle

      - name: Clean Build
        shell: pwsh
        run: |
          if (Test-Path .\bin) { Remove-Item -Recurse -Force .\bin }
          if (Test-Path .\obj) { Remove-Item -Recurse -Force .\obj }

      - name: Build arm64
        run: dotnet publish -c Release -r win-arm64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfContained=true -p:EnableWindowsTargeting=true

      - name: Build x64
        run: dotnet publish -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfContained=true -p:EnableWindowsTargeting=true

      - name: Build Packages
        shell: pwsh
        run: |
          Compress-Archive -Path (Get-ChildItem .\bin\Release\net9.0-windows\win-arm64\publish\* -File) `
                            -DestinationPath .\bin\makidice-windows-arm64.zip -Force
          Compress-Archive -Path (Get-ChildItem .\bin\Release\net9.0-windows\win-x64\publish\* -File) `
                            -DestinationPath .\bin\makidice-windows-x64.zip -Force

      - name: Upload arm64 Artifact
        uses: actions/upload-artifact@v6
        with:
          name: makidice-windows-arm64
          path: .\bin\makidice-windows-arm64.zip

      - name: Upload x64 Artifact
        uses: actions/upload-artifact@v6
        with:
          name: makidice-windows-x64
          path: .\bin\makidice-windows-x64.zip
